name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 依赖安装、构建、测试全部由 bun 执行
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 产物以 Node 为运行目标，需要 node 来验证它能在纯 Node 下跑起来。
      # 固定为 engines.node 的下限：在最低支持版本上验证比在最新版上更有意义
      - uses: actions/setup-node@v7
        with:
          node-version: '20.12.0'

      - name: Cache bun dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
          key: |
            ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Build
        run: bun run build

      # 用 node 而不是 bun 跑产物：用户机器上只有 node
      - name: Smoke test the bundle on plain Node
        run: |
          node bin/run.js --version
          node bin/run.js --help > /dev/null

      # 低于下限时必须是友好提示 + exit 1，而不是 clack 的 styleText 链接错误。
      # 这一步防的是「有人把 bin/run.js 的动态 import 改回静态 import」这类回归
      - name: Verify the Node version guard rejects old Node
        uses: actions/setup-node@v7
        with:
          node-version: '18.x'

      - name: Run the guard on Node 18
        run: |
          set +e
          output=$(node bin/run.js --version 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "::error::expected a non-zero exit on unsupported Node"
            exit 1
          fi
          case "$output" in
            *"Node version error"*) echo "guard OK" ;;
            *) echo "::error::expected the friendly guard message, got the above"; exit 1 ;;
          esac

      # tarball 里不该出现 devDependencies / scripts，工作区也必须被还原
      - name: Verify the publish tarball
        run: node scripts/verify-tarball.js

  merge-dependabot:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' }}
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: fastify/github-action-merge-dependabot@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
